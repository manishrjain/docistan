services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8108:8108"
    # No volume on purpose: docistan rebuilds the whole collection from the
    # JSON sidecars on every boot, so a persisted index would only be a second
    # source of truth that can drift.
    tmpfs:
      - /data
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-docistan-dev-key}
      --enable-cors=false
    healthcheck:
      # The image ships no HTTP client at all — no curl, no wget, no nc — so
      # the check speaks HTTP over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 5s
      timeout: 3s
      retries: 10
