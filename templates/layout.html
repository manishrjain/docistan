{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#221f22">
<title>{{if .Title}}{{.Title}} · {{end}}docistan</title>
<link rel="preload" href="/static/fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/toast.js" defer></script>
<script src="/static/drop.js" defer></script>
<script src="/static/live.js" defer></script>
{{block "head" .}}{{end}}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">docistan</a>
  <form class="searchbox" action="/" method="get">
    <input type="search" name="q" value="{{.Query.Q}}" placeholder="Search documents…" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <nav>
    <a href="/upload">Upload</a>
    <a href="/status">Status</a>
  </nav>
</header>
<main>
{{block "content" .}}{{end}}
</main>
</body>
</html>{{end}}
